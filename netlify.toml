# Build e cabeçalhos da Netlify. As variáveis VITE_FIREBASE_* são cadastradas no painel
# da Netlify (Site configuration > Environment variables), não aqui.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O painel não deve ser guardado em cache nem aparecer em buscadores.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Arquivos do Vite têm hash no nome: cache de um ano. As fotos de public/scr não entram
# aqui porque podem ser trocadas mantendo o nome.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
